; PHP-FPM per-directory settings for Tinkuy on Azure App Service Linux.
; Sessions go to /tmp (local container storage) to avoid Azure Files SMB caching,
; which delayed session visibility between FPM workers and broke login/2FA.
; index.php also enforces this path via ini_set() before session_start().
session.save_path = "/tmp/tinkuy_sessions"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 1800
