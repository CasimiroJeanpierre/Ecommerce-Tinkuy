; PHP-FPM per-directory settings for Tinkuy on Azure App Service Linux.
; startup.sh creates /home/site/php_sessions (chmod 777) before nginx starts,
; so this path is always available when PHP-FPM processes the first request.
session.save_path = "/home/site/php_sessions"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 1800
