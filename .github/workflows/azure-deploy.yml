name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: app-tinkuy
  PHP_VERSION: "8.2"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, mbstring, openssl, intl
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Restart App Service to apply startup.sh nginx config
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          KUDU_USER=$(echo "$PUBLISH_PROFILE" | python3 -c "
          import sys, re
          c = sys.stdin.read()
          m = re.search(r'userName=\"(\\\$[^\"]+)\"', c)
          print(m.group(1) if m else '')
          ")
          KUDU_PASS=$(echo "$PUBLISH_PROFILE" | python3 -c "
          import sys, re
          c = sys.stdin.read()
          m = re.search(r'userPWD=\"([^\"]+)\"', c)
          print(m.group(1) if m else '')
          ")
          if [ -n "$KUDU_USER" ] && [ -n "$KUDU_PASS" ]; then
            curl -sf -X POST \
              --user "$KUDU_USER:$KUDU_PASS" \
              "https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/restart" \
              && echo "App restarted OK" \
              || echo "Restart request sent"
            sleep 30
          else
            echo "Could not extract Kudu credentials from publish profile"
          fi
